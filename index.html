<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Estúdio de Jogos</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#263872">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Estúdio de Jogos">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: #2a2520; font-family: 'Kalam', cursive;
            user-select: none; -webkit-user-select: none;
            position: fixed;
        }
        canvas { display: block; position: absolute; top: 0; left: 0; cursor: default; }
        #installBtn {
            position: fixed; bottom: 20px; right: 20px;
            padding: 12px 20px; border-radius: 25px;
            background: #2e7336; color: #f5f2e6;
            border: 2px solid #f5f2e6; font-size: 14px; cursor: pointer;
            z-index: 100; display: none; font-family: 'Kalam', cursive;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        #installBtn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <canvas id="hub"></canvas>
    <button id="installBtn">📲 Instalar App</button>

    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW registrado:', reg.scope))
                .catch(err => console.log('SW falhou:', err));
        });
    }
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block';
    });
    installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') installBtn.style.display = 'none';
            deferredPrompt = null;
        }
    });

    const canvas = document.getElementById('hub');
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0, DPR = window.devicePixelRatio || 1;
    let lastW = 0, lastH = 0;

    function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        if (Math.abs(W - lastW) > 10 || Math.abs(H - lastH) > 10) {
            canvas.width = W * DPR;
            canvas.height = H * DPR;
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            generatePaperTexture();
            lastW = W; lastH = H;
        }
    }
    let resizeTimeout;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(resize, 250);
    });

    const COLORS = {
        paper: '#f5f2e6', paperDark: '#e8e2d0', paperLine: '#c9bfa8',
        margin: '#a62e2e', ink: '#263872', inkLight: '#3d5599',
        inkRed: '#a62e2e', inkGold: '#b8892f', shadow: 'rgba(0,0,0,0.15)'
    };

    let paperTexture = null;
    function generatePaperTexture() {
        const tex = document.createElement('canvas');
        tex.width = W; tex.height = H;
        const tctx = tex.getContext('2d');
        tctx.fillStyle = COLORS.paper;
        tctx.fillRect(0, 0, W, H);
        for (let i = 0; i < 6; i++) {
            const x = Math.random() * W, y = Math.random() * H;
            const r = 50 + Math.random() * 100;
            const grad = tctx.createRadialGradient(x, y, 0, x, y, r);
            grad.addColorStop(0, 'rgba(180, 160, 120, 0.06)');
            grad.addColorStop(1, 'rgba(180, 160, 120, 0)');
            tctx.fillStyle = grad;
            tctx.beginPath(); tctx.arc(x, y, r, 0, Math.PI * 2); tctx.fill();
        }
        paperTexture = tex;
    }

    const floatingIcons = [];
    function initFloatingIcons() {
        const icons = ['agua','fogo','terra','ar','estrela','diamante','flor','dragao'];
        for (let i = 0; i < 10; i++) {
            floatingIcons.push({
                id: icons[i % icons.length],
                x: Math.random() * W, y: Math.random() * H,
                vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
                r: 30 + Math.random() * 20,
                rot: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 0.01
            });
        }
    }

    function drawIcon(ctx, id, x, y, r, color) {
        ctx.save();
        ctx.strokeStyle = color; ctx.fillStyle = color;
        ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        const s = r * 0.5;
        switch(id) {
            case 'agua': ctx.beginPath(); ctx.moveTo(x, y - s);
                ctx.bezierCurveTo(x + s, y - s*0.3, x + s*0.8, y + s, x, y + s);
                ctx.bezierCurveTo(x - s*0.8, y + s, x - s, y - s*0.3, x, y - s); ctx.stroke(); break;
            case 'fogo': ctx.beginPath(); ctx.moveTo(x, y + s);
                ctx.bezierCurveTo(x - s*0.8, y + s*0.5, x - s*0.6, y - s*0.3, x, y - s);
                ctx.bezierCurveTo(x + s*0.6, y - s*0.3, x + s*0.8, y + s*0.5, x, y + s); ctx.stroke(); break;
            case 'terra': ctx.beginPath(); ctx.moveTo(x - s, y + s*0.7); ctx.lineTo(x - s*0.3, y - s*0.5);
                ctx.lineTo(x, y - s*0.2); ctx.lineTo(x + s*0.4, y - s*0.8);
                ctx.lineTo(x + s, y + s*0.7); ctx.closePath(); ctx.stroke(); break;
            case 'ar': ctx.beginPath(); ctx.moveTo(x - s, y - s*0.4);
                ctx.quadraticCurveTo(x - s*0.3, y - s*0.8, x + s*0.3, y - s*0.4); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x - s*0.8, y);
                ctx.quadraticCurveTo(x, y - s*0.4, x + s*0.8, y); ctx.stroke(); break;
            case 'estrela': ctx.beginPath();
                for (let i = 0; i < 10; i++) { const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
                    const r2 = i % 2 === 0 ? s*0.9 : s*0.4;
                    if (i === 0) ctx.moveTo(x + Math.cos(a)*r2, y + Math.sin(a)*r2);
                    else ctx.lineTo(x + Math.cos(a)*r2, y + Math.sin(a)*r2); }
                ctx.closePath(); ctx.stroke(); break;
            case 'diamante': ctx.beginPath(); ctx.moveTo(x - s*0.6, y - s*0.3); ctx.lineTo(x + s*0.6, y - s*0.3);
                ctx.lineTo(x, y + s*0.8); ctx.closePath(); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x - s*0.6, y - s*0.3); ctx.lineTo(x - s*0.3, y - s*0.7);
                ctx.lineTo(x + s*0.3, y - s*0.7); ctx.lineTo(x + s*0.6, y - s*0.3); ctx.stroke(); break;
            case 'flor': for (let i = 0; i < 5; i++) { const a = (i/5)*Math.PI*2;
                ctx.beginPath(); ctx.ellipse(x + Math.cos(a)*s*0.4, y + Math.sin(a)*s*0.4, s*0.25, s*0.15, a, 0, Math.PI*2); ctx.stroke(); }
                ctx.beginPath(); ctx.arc(x, y, s*0.15, 0, Math.PI*2); ctx.fill(); break;
            case 'dragao': ctx.beginPath(); ctx.ellipse(x, y, s*0.5, s*0.3, 0, 0, Math.PI*2); ctx.stroke();
                ctx.beginPath(); ctx.arc(x + s*0.4, y - s*0.2, s*0.25, 0, Math.PI*2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x + s*0.55, y - s*0.3); ctx.lineTo(x + s*0.7, y - s*0.4); ctx.stroke(); break;
            default: ctx.beginPath(); ctx.arc(x, y, s*0.6, 0, Math.PI*2); ctx.stroke();
        }
        ctx.restore();
    }

    function roundRect(ctx, x, y, w, h, r, fill, stroke) {
        ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
        ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r);
        ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
        ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r);
        ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
        if (fill) ctx.fill(); if (stroke) ctx.stroke();
    }

    const games = [
        {
            id: 'tracos',
            title: 'Traços & Tinta',
            subtitle: 'uma alquimia de desenhos',
            icon: 'tinteiro',
            path: './tracos/index.html',
            description: '40 níveis • Combine elementos',
            color: COLORS.ink
        },
        {
            id: 'juntatudo',
            title: 'JuntaTudo',
            subtitle: 'memória que evolui',
            icon: 'cartas',
            path: './juntatudo/index.html',
            description: '5 níveis • Encontre e evolua',
            color: COLORS.ink
        }
    ];

    let buttons = [];

    function drawGameCards() {
        buttons = [];
        const cardW = Math.min(320, W - 60);
        const cardH = 180;
        const centerX = (W - cardW) / 2;
        const spacing = 30;
        const totalH = games.length * cardH + (games.length - 1) * spacing;
        const startY = (H - totalH) / 2 + 40;

        games.forEach((game, i) => {
            const x = centerX;
            const y = startY + i * (cardH + spacing);

            ctx.fillStyle = COLORS.shadow;
            roundRect(ctx, x + 3, y + 4, cardW, cardH, 15, true, false);

            ctx.fillStyle = COLORS.paper;
            roundRect(ctx, x, y, cardW, cardH, 15, true, false);

            ctx.strokeStyle = game.color;
            ctx.lineWidth = 2.5;
            roundRect(ctx, x, y, cardW, cardH, 15, false, true);

            ctx.globalAlpha = 0.15;
            if (game.icon === 'tinteiro') {
                ctx.fillStyle = game.color;
                ctx.beginPath();
                ctx.arc(x + 60, y + cardH/2, 35, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = COLORS.paper;
                ctx.beginPath();
                ctx.arc(x + 60, y + cardH/2, 28, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = game.color;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(x + 60, y + cardH/2 - 20);
                ctx.lineTo(x + 60, y + cardH/2 + 20);
                ctx.stroke();
            } else if (game.icon === 'cartas') {
                ctx.fillStyle = game.color;
                ctx.fillRect(x + 40, y + cardH/2 - 30, 40, 60);
                ctx.fillStyle = COLORS.paper;
                ctx.fillRect(x + 50, y + cardH/2 - 25, 30, 50);
                ctx.strokeStyle = game.color;
                ctx.lineWidth = 2;
                ctx.strokeRect(x + 50, y + cardH/2 - 25, 30, 50);
            }
            ctx.globalAlpha = 1;

            ctx.fillStyle = game.color;
            ctx.font = 'bold 32px Caveat, cursive';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(game.title, x + 110, y + 55);

            ctx.font = '16px Kalam, cursive';
            ctx.fillStyle = COLORS.inkLight;
            ctx.fillText(game.subtitle, x + 110, y + 85);

            ctx.font = '14px Kalam, cursive';
            ctx.fillStyle = COLORS.ink;
            ctx.fillText(game.description, x + 110, y + 115);

            ctx.fillStyle = game.color;
            ctx.font = 'bold 28px Kalam, cursive';
            ctx.textAlign = 'right';
            ctx.fillText('→', x + cardW - 20, y + cardH/2);

            // ✅ CORREÇÃO: Adicionado 'path' ao objeto button
            buttons.push({ x, y, w: cardW, h: cardH, id: game.id, path: game.path });
        });
    }

    function draw() {
        if (paperTexture) ctx.drawImage(paperTexture, 0, 0, W, H);
        else { ctx.fillStyle = COLORS.paper; ctx.fillRect(0, 0, W, H); }

        ctx.strokeStyle = COLORS.paperLine;
        ctx.lineWidth = 1;
        for (let y = 80; y < H; y += 45) {
            ctx.beginPath();
            ctx.moveTo(40, y);
            ctx.lineTo(W - 40, y);
            ctx.stroke();
        }

        ctx.strokeStyle = COLORS.margin;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(65, 0);
        ctx.lineTo(65, H);
        ctx.stroke();

        ctx.globalAlpha = 0.15;
        for (const el of floatingIcons) {
            el.x += el.vx; el.y += el.vy; el.rot += el.rotSpeed;
            if (el.x < -50) el.x = W + 50; if (el.x > W + 50) el.x = -50;
            if (el.y < -50) el.y = H + 50; if (el.y > H + 50) el.y = -50;
            ctx.save();
            ctx.translate(el.x, el.y);
            ctx.rotate(el.rot);
            drawIcon(ctx, el.id, 0, 0, el.r, COLORS.ink);
            ctx.restore();
        }
        ctx.globalAlpha = 1;

        const titleY = H * 0.12;
        ctx.fillStyle = COLORS.shadow;
        ctx.font = 'bold 52px Caveat, cursive';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Estúdio de Jogos', W/2 + 3, titleY + 3);
        ctx.fillStyle = COLORS.ink;
        ctx.fillText('Estúdio de Jogos', W/2, titleY);

        ctx.font = '18px Kalam, cursive';
        ctx.fillStyle = COLORS.inkLight;
        ctx.fillText('escolha sua aventura', W/2, titleY + 40);

        ctx.strokeStyle = COLORS.ink;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(W/2 - 100, titleY + 60);
        ctx.lineTo(W/2 + 100, titleY + 60);
        ctx.stroke();

        drawGameCards();

        ctx.fillStyle = COLORS.inkLight;
        ctx.font = '12px Kalam, cursive';
        ctx.textAlign = 'center';
        ctx.fillText('© 2026 • lcorreard.github.io', W/2, H - 20);
    }

    function getPos(e) {
        const t = e.touches ? (e.touches[0] || e.changedTouches[0]) : e;
        const r = canvas.getBoundingClientRect();
        return { x: t.clientX - r.left, y: t.clientY - r.top };
    }

    function pointInRect(px, py, r) {
        return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
    }

    function handleClick(x, y) {
        for (const btn of buttons) {
            if (pointInRect(x, y, btn)) {
                // ✅ CORREÇÃO: Verificação de segurança
                if (btn.path) {
                    window.location.href = btn.path;
                } else {
                    console.error('Caminho não definido para:', btn.id);
                }
                return true;
            }
        }
        return false;
    }

    function onDown(e) {
        e.preventDefault();
        const pos = getPos(e);
        handleClick(pos.x, pos.y);
    }

    canvas.addEventListener('touchstart', onDown, { passive: false });
    canvas.addEventListener('mousedown', onDown);

    function gameLoop(timestamp) {
        try {
            ctx.clearRect(0, 0, W, H);
            draw();
        } catch (error) {
            console.error("Erro no Hub:", error);
        }
        requestAnimationFrame(gameLoop);
    }

    resize();
    initFloatingIcons();
    requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
