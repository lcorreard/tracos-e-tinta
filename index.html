<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Traços & Tinta</title>
    
    <!-- PWA: Tornar instalável -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#263872">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Traços & Tinta">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    
    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: #2a2520; font-family: 'Kalam', cursive;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }
        canvas { display: block; position: absolute; top: 0; left: 0; cursor: default; }
        #muteBtn {
            position: fixed; top: 15px; right: 15px;
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(38, 56, 114, 0.85); color: #f5f2e6;
            border: 2px solid #f5f2e6; font-size: 20px; cursor: pointer;
            z-index: 100; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3); transition: transform 0.2s;
        }
        #muteBtn:active { transform: scale(0.9); }
        #installBtn {
            position: fixed; bottom: 20px; right: 20px;
            padding: 12px 20px; border-radius: 25px;
            background: #2e7336; color: #f5f2e6;
            border: 2px solid #f5f2e6; font-size: 14px; cursor: pointer;
            z-index: 100; display: none; font-family: 'Kalam', cursive;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        #installBtn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <button id="muteBtn" title="Som">🔊</button>
    <button id="installBtn">📲 Instalar App</button>

    <script>
    // ============================================
    // REGISTRO DO SERVICE WORKER (PWA)
    // ============================================
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW registrado:', reg.scope))
                .catch(err => console.log('SW falhou:', err));
        });
    }

    // Botão de instalação PWA
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block';
    });
    installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') installBtn.style.display = 'none';
            deferredPrompt = null;
        }
    });

    // ============================================
    // CONFIGURAÇÃO INICIAL
    // ============================================
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0, DPR = window.devicePixelRatio || 1;

    function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * DPR;
        canvas.height = H * DPR;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        generatePaperTexture();
    }
    window.addEventListener('resize', resize);

    const COLORS = {
        paper: '#f5f2e6', paperDark: '#e8e2d0', paperLine: '#c9bfa8',
        margin: '#a62e2e', ink: '#263872', inkLight: '#3d5599',
        inkRed: '#a62e2e', inkGreen: '#2e7336', inkGold: '#b8892f',
        dragLine: 'rgba(38, 56, 114, 0.55)', shadow: 'rgba(0, 0, 0, 0.15)'
    };

    let paperTexture = null;
    function generatePaperTexture() {
        const tex = document.createElement('canvas');
        tex.width = W; tex.height = H;
        const tctx = tex.getContext('2d');
        tctx.fillStyle = COLORS.paper;
        tctx.fillRect(0, 0, W, H);
        const imgData = tctx.getImageData(0, 0, W, H);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
            const noise = (Math.random() - 0.5) * 18;
            data[i] = Math.max(0, Math.min(255, data[i] + noise));
            data[i+1] = Math.max(0, Math.min(255, data[i+1] + noise));
            data[i+2] = Math.max(0, Math.min(255, data[i+2] + noise - 5));
        }
        tctx.putImageData(imgData, 0, 0);
        for (let i = 0; i < 8; i++) {
            const x = Math.random() * W, y = Math.random() * H;
            const r = 30 + Math.random() * 80;
            const grad = tctx.createRadialGradient(x, y, 0, x, y, r);
            grad.addColorStop(0, 'rgba(180, 160, 120, 0.08)');
            grad.addColorStop(1, 'rgba(180, 160, 120, 0)');
            tctx.fillStyle = grad;
            tctx.beginPath(); tctx.arc(x, y, r, 0, Math.PI * 2); tctx.fill();
        }
        paperTexture = tex;
    }

    let audioCtx = null, muted = false, audioInitialized = false;
    let musicPlaying = false, musicNodes = [];

    function initAudio() {
        if (audioInitialized) return;
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); audioInitialized = true; }
        catch(e) {}
    }

    function playTone(freq, duration, type = 'sine', volume = 0.15, attack = 0.01) {
        if (muted || !audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type; osc.frequency.value = freq;
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(volume, now + attack);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.start(now); osc.stop(now + duration);
    }

    function startMusic() {
        if (muted || !audioCtx || musicPlaying) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        musicPlaying = true;
        const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
        const masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.04;
        masterGain.connect(audioCtx.destination);
        musicNodes.push(masterGain);
        function playNote() {
            if (!musicPlaying || muted) return;
            const freq = scale[Math.floor(Math.random() * scale.length)];
            const osc = audioCtx.createOscillator();
            const noteGain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass'; filter.frequency.value = 1200;
            osc.type = 'sine'; osc.frequency.value = freq;
            osc.connect(filter); filter.connect(noteGain); noteGain.connect(masterGain);
            const now = audioCtx.currentTime;
            noteGain.gain.setValueAtTime(0, now);
            noteGain.gain.linearRampToValueAtTime(0.3, now + 0.3);
            noteGain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
            osc.start(now); osc.stop(now + 2.5);
            setTimeout(playNote, 800 + Math.random() * 1200);
        }
        playNote();
        setTimeout(playNote, 400);
    }

    function stopMusic() {
        musicPlaying = false;
        musicNodes.forEach(n => { try { n.disconnect(); } catch(e) {} });
        musicNodes = [];
    }

    let dragNoiseNode = null, dragGain = null;
    function startDragSound() {
        if (muted || !audioCtx || dragNoiseNode) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const bufferSize = 2 * audioCtx.sampleRate;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.3;
        dragNoiseNode = audioCtx.createBufferSource();
        dragNoiseNode.buffer = buffer; dragNoiseNode.loop = true;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass'; filter.frequency.value = 2500; filter.Q.value = 1.5;
        dragGain = audioCtx.createGain(); dragGain.gain.value = 0.04;
        dragNoiseNode.connect(filter); filter.connect(dragGain);
        dragGain.connect(audioCtx.destination); dragNoiseNode.start();
    }
    function stopDragSound() {
        if (dragNoiseNode) { try { dragNoiseNode.stop(); } catch(e) {} dragNoiseNode = null; dragGain = null; }
    }

    function soundCombine() {
        playTone(523, 0.15, 'sine', 0.2);
        setTimeout(() => playTone(659, 0.15, 'sine', 0.2), 60);
        setTimeout(() => playTone(784, 0.25, 'sine', 0.2), 120);
    }
    function soundFail() {
        playTone(220, 0.3, 'sawtooth', 0.1);
        setTimeout(() => playTone(165, 0.4, 'sawtooth', 0.1), 100);
    }
    function soundLevelUp() {
        [523, 659, 784, 1047].forEach((n, i) => setTimeout(() => playTone(n, 0.2, 'triangle', 0.2), i * 80));
    }
    function soundClick() { playTone(800, 0.08, 'square', 0.1); }
    function soundInkDrop() { playTone(180, 0.1, 'sine', 0.15); }
    function soundDiscovery() {
        [440, 554, 659, 880, 1108].forEach((n, i) => setTimeout(() => playTone(n, 0.3, 'triangle', 0.25), i * 100));
    }
    function soundAchievement() {
        [523, 659, 784, 1047, 1318].forEach((n, i) => setTimeout(() => playTone(n, 0.25, 'sine', 0.3), i * 70));
    }

    const muteBtn = document.getElementById('muteBtn');
    muteBtn.addEventListener('click', () => {
        muted = !muted;
        muteBtn.textContent = muted ? '🔇' : '🔊';
        if (muted) { stopDragSound(); stopMusic(); } else { startMusic(); }
    });

    class Particle {
        constructor(x, y, color, opts = {}) {
            this.x = x; this.y = y;
            this.vx = opts.vx !== undefined ? opts.vx : (Math.random() - 0.5) * 6;
            this.vy = opts.vy !== undefined ? opts.vy : (Math.random() - 0.5) * 6 - 2;
            this.life = 1; this.size = opts.size || 3 + Math.random() * 5;
            this.color = color;
            this.gravity = opts.gravity !== undefined ? opts.gravity : 0.15;
            this.isConfetti = opts.isConfetti || false;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 0.3;
            this.width = this.isConfetti ? 4 + Math.random() * 4 : this.size;
            this.height = this.isConfetti ? 8 + Math.random() * 6 : this.size;
        }
        update(dt) {
            this.x += this.vx; this.y += this.vy; this.vy += this.gravity;
            this.life -= dt * (this.isConfetti ? 0.6 : 1.2);
            this.rotation += this.rotSpeed;
        }
        draw(ctx) {
            if (this.life <= 0) return;
            ctx.globalAlpha = this.life; ctx.fillStyle = this.color;
            if (this.isConfetti) {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rotation);
                ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
                ctx.restore();
            } else {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1;
        }
    }

    const particles = [];
    function spawnParticles(x, y, color, count = 20) {
        for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color));
    }
    function spawnConfetti(x, y, count = 60) {
        const colors = ['#a62e2e', '#2e7336', '#b8892f', '#263872', '#8b4513', '#c71585'];
        for (let i = 0; i < count; i++) {
            particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)], {
                vx: (Math.random() - 0.5) * 12, vy: -Math.random() * 10 - 3,
                gravity: 0.25, isConfetti: true, size: 5
            }));
        }
    }

    const inkTrail = [];
    function addInkTrail(x, y) {
        inkTrail.push({ x, y, life: 1, size: 3 + Math.random() * 2 });
        if (inkTrail.length > 30) inkTrail.shift();
    }

    const scratchMarks = [];
    function addScratchMark(x, y) { scratchMarks.push({ x, y, life: 2, size: 20 + Math.random() * 15 }); }

    function drawIcon(ctx, id, x, y, r, color) {
        ctx.save();
        ctx.strokeStyle = color; ctx.fillStyle = color;
        ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        const s = r * 0.5;
        switch(id) {
            case 'agua':
                ctx.beginPath(); ctx.moveTo(x, y - s);
                ctx.bezierCurveTo(x + s, y - s*0.3, x + s*0.8, y + s, x, y + s);
                ctx.bezierCurveTo(x - s*0.8, y + s, x - s, y - s*0.3, x, y - s); ctx.stroke(); break;
            case 'fogo':
                ctx.beginPath(); ctx.moveTo(x, y + s);
                ctx.bezierCurveTo(x - s*0.8, y + s*0.5, x - s*0.6, y - s*0.3, x, y - s);
                ctx.bezierCurveTo(x + s*0.6, y - s*0.3, x + s*0.8, y + s*0.5, x, y + s); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x, y + s*0.5);
                ctx.bezierCurveTo(x - s*0.3, y + s*0.2, x - s*0.2, y - s*0.2, x, y - s*0.5);
                ctx.bezierCurveTo(x + s*0.2, y - s*0.2, x + s*0.3, y + s*0.2, x, y + s*0.5); ctx.stroke(); break;
            case 'terra':
                ctx.beginPath(); ctx.moveTo(x - s, y + s*0.7); ctx.lineTo(x - s*0.3, y - s*0.5);
                ctx.lineTo(x, y - s*0.2); ctx.lineTo(x + s*0.4, y - s*0.8);
                ctx.lineTo(x + s, y + s*0.7); ctx.closePath(); ctx.stroke(); break;
            case 'ar':
                ctx.beginPath(); ctx.moveTo(x - s, y - s*0.4);
                ctx.quadraticCurveTo(x - s*0.3, y - s*0.8, x + s*0.3, y - s*0.4); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x - s*0.8, y);
                ctx.quadraticCurveTo(x, y - s*0.4, x + s*0.8, y); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x - s, y + s*0.4);
                ctx.quadraticCurveTo(x - s*0.3, y, x + s*0.3, y + s*0.4); ctx.stroke(); break;
            case 'semente':
                ctx.beginPath(); ctx.ellipse(x, y + s*0.3, s*0.3, s*0.4, 0, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x, y - s*0.1); ctx.lineTo(x, y - s*0.8); ctx.stroke();
                ctx.beginPath(); ctx.ellipse(x - s*0.2, y - s*0.6, s*0.15, s*0.25, -0.5, 0, Math.PI * 2); ctx.stroke(); break;
            case 'pedra':
                ctx.beginPath(); ctx.moveTo(x - s*0.8, y + s*0.2); ctx.lineTo(x - s*0.5, y - s*0.6);
                ctx.lineTo(x + s*0.3, y - s*0.7); ctx.lineTo(x + s*0.9, y - s*0.1);
                ctx.lineTo(x + s*0.6, y + s*0.7); ctx.lineTo(x - s*0.4, y + s*0.7); ctx.closePath(); ctx.stroke(); break;
            case 'magma':
                ctx.beginPath(); ctx.moveTo(x - s*0.8, y + s*0.5); ctx.lineTo(x - s*0.4, y - s*0.3);
                ctx.lineTo(x + s*0.4, y - s*0.3); ctx.lineTo(x + s*0.8, y + s*0.5); ctx.closePath(); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x - s*0.2, y - s*0.3);
                ctx.quadraticCurveTo(x - s*0.1, y - s*0.8, x, y - s*0.5);
                ctx.quadraticCurveTo(x + s*0.1, y - s*0.9, x + s*0.2, y - s*0.3); ctx.stroke(); break;
            case 'vapor':
                ctx.beginPath(); ctx.arc(x - s*0.4, y, s*0.35, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.arc(x + s*0.1, y - s*0.2, s*0.4, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.arc(x + s*0.4, y + s*0.2, s*0.3, 0, Math.PI * 2); ctx.stroke(); break;
            case 'lama':
                ctx.beginPath(); ctx.ellipse(x, y + s*0.2, s*0.8, s*0.4, 0, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.arc(x - s*0.3, y - s*0.3, s*0.1, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(x + s*0.4, y - s*0.1, s*0.08, 0, Math.PI * 2); ctx.fill(); break;
            case 'carvao':
                ctx.beginPath(); ctx.moveTo(x, y - s*0.8); ctx.lineTo(x + s*0.7, y);
                ctx.lineTo(x, y + s*0.8); ctx.lineTo(x - s*0.7, y); ctx.closePath(); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x - s*0.2, y - s*0.3); ctx.lineTo(x + s*0.1, y); ctx.stroke(); break;
            case 'diamante':
                ctx.beginPath(); ctx.moveTo(x - s*0.6, y - s*0.3); ctx.lineTo(x + s*0.6, y - s*0.3);
                ctx.lineTo(x, y + s*0.8); ctx.closePath(); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x - s*0.6, y - s*0.3); ctx.lineTo(x - s*0.3, y - s*0.7);
                ctx.lineTo(x + s*0.3, y - s*0.7); ctx.lineTo(x + s*0.6, y - s*0.3); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x - s*0.3, y - s*0.7); ctx.lineTo(x - s*0.15, y - s*0.3);
                ctx.lineTo(x, y + s*0.8); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x + s*0.3, y - s*0.7); ctx.lineTo(x + s*0.15, y - s*0.3);
                ctx.lineTo(x, y + s*0.8); ctx.stroke(); break;
            case 'luz':
                ctx.beginPath(); ctx.arc(x, y, s*0.35, 0, Math.PI * 2); ctx.stroke();
                for (let i = 0; i < 8; i++) { const a = (i / 8) * Math.PI * 2; ctx.beginPath();
                    ctx.moveTo(x + Math.cos(a) * s*0.5, y + Math.sin(a) * s*0.5);
                    ctx.lineTo(x + Math.cos(a) * s*0.8, y + Math.sin(a) * s*0.8); ctx.stroke(); } break;
            case 'estrela':
                ctx.beginPath();
                for (let i = 0; i < 10; i++) { const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
                    const r2 = i % 2 === 0 ? s*0.9 : s*0.4;
                    if (i === 0) ctx.moveTo(x + Math.cos(a)*r2, y + Math.sin(a)*r2);
                    else ctx.lineTo(x + Math.cos(a)*r2, y + Math.sin(a)*r2); }
                ctx.closePath(); ctx.stroke(); break;
            case 'arvore':
                ctx.beginPath(); ctx.moveTo(x - s*0.15, y + s*0.8); ctx.lineTo(x - s*0.15, y + s*0.1);
                ctx.lineTo(x + s*0.15, y + s*0.1); ctx.lineTo(x + s*0.15, y + s*0.8); ctx.stroke();
                ctx.beginPath(); ctx.arc(x, y - s*0.3, s*0.6, 0, Math.PI * 2); ctx.stroke(); break;
            case 'vulcao':
                ctx.beginPath(); ctx.moveTo(x - s*0.9, y + s*0.8); ctx.lineTo(x - s*0.25, y - s*0.3);
                ctx.lineTo(x + s*0.25, y - s*0.3); ctx.lineTo(x + s*0.9, y + s*0.8); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x - s*0.25, y - s*0.3); ctx.lineTo(x - s*0.15, y - s*0.5);
                ctx.lineTo(x + s*0.15, y - s*0.5); ctx.lineTo(x + s*0.25, y - s*0.3); ctx.stroke();
                ctx.beginPath(); ctx.arc(x - s*0.1, y - s*0.7, s*0.15, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.arc(x + s*0.15, y - s*0.85, s*0.12, 0, Math.PI * 2); ctx.stroke(); break;
            case 'metal':
                ctx.beginPath(); ctx.moveTo(x - s*0.7, y - s*0.5); ctx.lineTo(x + s*0.7, y - s*0.5);
                ctx.lineTo(x + s*0.5, y + s*0.5); ctx.lineTo(x - s*0.5, y + s*0.5); ctx.closePath(); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x - s*0.3, y - s*0.2); ctx.lineTo(x + s*0.3, y - s*0.2); ctx.stroke(); break;
            case 'vidro':
                ctx.beginPath(); ctx.moveTo(x - s*0.5, y - s*0.8); ctx.lineTo(x + s*0.5, y - s*0.8);
                ctx.lineTo(x + s*0.7, y + s*0.8); ctx.lineTo(x - s*0.7, y + s*0.8); ctx.closePath(); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x - s*0.2, y - s*0.5); ctx.lineTo(x + s*0.1, y + s*0.3); ctx.stroke(); break;
            case 'areia':
                ctx.beginPath(); ctx.moveTo(x - s*0.8, y + s*0.5);
                ctx.quadraticCurveTo(x - s*0.3, y - s*0.3, x, y - s*0.2);
                ctx.quadraticCurveTo(x + s*0.3, y - s*0.1, x + s*0.8, y + s*0.5); ctx.stroke();
                for (let i = 0; i < 5; i++) { ctx.beginPath();
                    ctx.arc(x + (Math.random()-0.5)*s*1.2, y + Math.random()*s*0.5, 1.5, 0, Math.PI*2); ctx.fill(); } break;
            case 'oceano':
                for (let i = 0; i < 3; i++) { ctx.beginPath(); const yO = y - s*0.4 + i*s*0.4;
                    ctx.moveTo(x - s*0.8, yO); ctx.quadraticCurveTo(x - s*0.4, yO - s*0.2, x, yO);
                    ctx.quadraticCurveTo(x + s*0.4, yO + s*0.2, x + s*0.8, yO); ctx.stroke(); } break;

    class DrawingElement {
        constructor(id, name, x, y) {
            this.id = id; this.name = name; this.x = x; this.y = y;
            this.targetX = x; this.targetY = y;
            this.radius = Math.min(W, H) * 0.08;
            this.color = COLORS.ink; this.alive = true; this.isTarget = false;
            this.pulse = Math.random() * Math.PI * 2; this.spawnTime = 0;
            this.isNew = false; this.newTimer = 0;
        }
        contains(px, py) { return Math.sqrt((px-this.x)**2 + (py-this.y)**2) <= this.radius * 1.1; }
        update(dt) {
            this.pulse += dt * 2; this.spawnTime += dt;
            this.x += (this.targetX - this.x) * 0.1; this.y += (this.targetY - this.y) * 0.1;
            if (this.isNew) { this.newTimer += dt; if (this.newTimer > 3) this.isNew = false; }
        }
        draw(ctx) {
            if (!this.alive) return;
            const scale = Math.min(1, this.spawnTime * 3);
            const r = this.radius * scale;
            let extraR = this.isTarget ? Math.sin(this.pulse) * 3 : 0;
            if (this.isNew) {
                ctx.fillStyle = `rgba(184, 137, 47, ${0.3 + Math.sin(this.newTimer*5)*0.2})`;
                ctx.beginPath(); ctx.arc(this.x, this.y, r + extraR + 8, 0, Math.PI*2); ctx.fill();
            }
            ctx.fillStyle = COLORS.shadow; ctx.beginPath();
            ctx.arc(this.x + 3, this.y + 4, r + extraR, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = COLORS.paper; ctx.beginPath();
            ctx.arc(this.x, this.y, r + extraR, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = this.color; ctx.lineWidth = 3; ctx.beginPath();
            ctx.arc(this.x, this.y, r + extraR, 0, Math.PI*2); ctx.stroke();
            drawIcon(ctx, this.id, this.x, this.y - 5, r * 0.7, this.color);
            ctx.fillStyle = this.color; ctx.font = 'bold 14px Kalam, cursive';
            ctx.textAlign = 'center'; ctx.textBaseline = 'top';
            ctx.fillText(this.name, this.x, this.y + r * 0.55);
        }
    }

    class Combination {
        constructor(a, b, resultId, resultName) { this.a = a; this.b = b; this.resultId = resultId; this.resultName = resultName; }
        matches(id1, id2) { return (this.a === id1 && this.b === id2) || (this.a === id2 && this.b === id1); }
    }

    class InkTimer {
        constructor() { this.max = 100; this.current = 100; this.drainRate = 1.8; }
        update(dt) { this.current -= this.drainRate * dt; if (this.current < 0) this.current = 0; }
        reset() { this.current = this.max; }
        add(amount) { this.current = Math.min(this.current + amount, this.max); soundInkDrop(); }
        get percent() { return this.current / this.max; }
        get isEmpty() { return this.current <= 0; }
    }

    class LevelManager {
        constructor() { this.currentLevel = 1; this.elements = []; this.combinations = []; this.targetId = ''; this.targetName = ''; this.totalLevels = 40; }

        loadLevel(num) {
            this.currentLevel = num; this.elements = []; this.combinations = [];
            const w = W, h = H, cx = w/2, cy = h/2;
            const dr = {};
            for (let i = 1; i <= 40; i++) {
                if (i <= 5) dr[i] = 1.5;
                else if (i <= 10) dr[i] = 1.8;
                else if (i <= 20) dr[i] = 2.0;
                else if (i <= 30) dr[i] = 2.3;
                else dr[i] = 2.5;
            }
            game.inkTimer.drainRate = dr[num] || 2.0;

            const add = (id, name, x, y) => this.elements.push(new DrawingElement(id, name, x, y));
            const combo = (a, b, r, rn) => this.combinations.push(new Combination(a, b, r, rn));

            if (num === 1) {
                this.targetId = 'vapor'; this.targetName = 'Vapor';
                add('agua','Água',cx-w*0.25,cy+h*0.05); add('fogo','Fogo',cx+w*0.25,cy+h*0.05);
                add('terra','Terra',cx-w*0.25,cy+h*0.25); add('ar','Ar',cx+w*0.25,cy+h*0.25);
                combo('agua','fogo','vapor','Vapor'); combo('terra','agua','lama','Lama'); combo('fogo','ar','fumaca','Fumaça');
            } else if (num === 2) {
                this.targetId = 'vulcao'; this.targetName = 'Vulcão';
                add('fogo','Fogo',cx-w*0.25,cy+h*0.05); add('terra','Terra',cx+w*0.25,cy+h*0.05);
                add('agua','Água',cx-w*0.25,cy+h*0.25); add('ar','Ar',cx+w*0.25,cy+h*0.25);
                combo('terra','fogo','magma','Magma'); combo('magma','ar','vulcao','Vulcão'); combo('agua','fogo','vapor','Vapor');
            } else if (num === 3) {
                this.targetId = 'arvore'; this.targetName = 'Árvore';
                add('terra','Terra',cx-w*0.3,cy+h*0.05); add('agua','Água',cx,cy+h*0.05);
                add('semente','Semente',cx+w*0.3,cy+h*0.05); add('fogo','Fogo',cx-w*0.2,cy+h*0.25); add('ar','Ar',cx+w*0.2,cy+h*0.25);
                combo('terra','agua','lama','Lama'); combo('lama','semente','arvore','Árvore'); combo('fogo','ar','fumaca','Fumaça');
            } else if (num === 4) {

        spawnParticles(nx, ny, COLORS.ink, 15);
        showFeedback(' '+el.name+' recriado! -'+RECREATE_COST+' tinta');
        recreateMenuOpen = false;
    }

        if (game.inkTimer.current < HINT_COST) { showFeedback('Tinta insuficiente! (precisa de '+HINT_COST+')'); soundFail(); return; }

        if (hint) { game.inkTimer.current -= HINT_COST; soundInkDrop(); showFeedback('💡 Dica: '+hint.a+' + '+hint.b+' = '+hint.result); }

    function roundRect(ctx, x, y, w, h, r, fill, stroke) {
        ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
        ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r);
        ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
        ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r);
        ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
        if (fill) ctx.fill(); if (stroke) ctx.stroke();
    }

    function drawButton(x, y, w, h, text, id) {
        game.buttons.push({ x, y, w, h, id });

    function drawLevelSelect() {
        drawPaperBg();
        game.buttons = [];
        drawBackButton();
        ctx.fillStyle = COLORS.ink; ctx.font = 'bold 32px Caveat, cursive'; ctx.textAlign = 'center';
        ctx.fillText('Escolha um Nível', W/2, 50);

        const tw = cols*bs+(cols-1)*gap, sx = (W-tw)/2, sy = 75;
        for (let i = 1; i <= 40; i++) {
            const col = (i-1)%cols, row = Math.floor((i-1)/cols);
            const x = sx+col*(bs+gap), y = sy+row*(bs+gap);
            if (y + bs > H - 20) break;
            const unlocked = i <= saveData.maxLevel, bt = saveData.bestTimes[i];
            ctx.fillStyle = COLORS.shadow; roundRect(ctx,x+2,y+3,bs,bs,10,true,false);
            ctx.fillStyle = unlocked ? COLORS.paper : COLORS.paperDark; roundRect(ctx,x,y,bs,bs,10,true,false);
            ctx.strokeStyle = unlocked ? COLORS.ink : COLORS.paperLine; ctx.lineWidth = 2;
            roundRect(ctx,x,y,bs,bs,10,false,true);

    function drawStats() {
        drawPaperBg();
        game.buttons = [];
        drawBackButton();
        ctx.fillStyle = COLORS.ink; ctx.font = 'bold 26px Caveat, cursive'; ctx.textAlign = 'center';
        ctx.fillText('Estatísticas', W/2, 38);

            ctx.fillStyle = i%2===0 ? 'rgba(38,56,114,0.05)' : 'transparent'; ctx.fillRect(sx,y,cw,48);

    function fmtTime(s) {
        const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
        if (h > 0) return h+'h '+m+'m'; if (m > 0) return m+'m '+sec+'s'; return sec+'s';
    }

    function drawGame() {
        drawPaperBg();
        ctx.strokeStyle = COLORS.paperLine; ctx.lineWidth = 1;
        for (let y = 180; y < H; y += 45) { ctx.beginPath(); ctx.moveTo(40,y); ctx.lineTo(W-40,y); ctx.stroke(); }
        ctx.strokeStyle = COLORS.margin; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(65,0); ctx.lineTo(65,H); ctx.stroke();

        for (let i = scratchMarks.length-1; i >= 0; i--) {
            const m = scratchMarks[i]; ctx.globalAlpha = m.life*0.3; ctx.fillStyle = COLORS.inkRed;
            ctx.beginPath(); ctx.arc(m.x, m.y, m.size, 0, Math.PI*2); ctx.fill();
        }
        for (let i = 0; i < inkTrail.length; i++) {
            const t = inkTrail[i]; ctx.globalAlpha = t.life*0.5; ctx.fillStyle = COLORS.ink;
            ctx.beginPath(); ctx.arc(t.x, t.y, t.size, 0, Math.PI*2); ctx.fill();
        }
        ctx.globalAlpha = 1;

        drawGameHUD();
        for (const el of game.levelManager.elements) el.draw(ctx);
        for (const p of particles) p.draw(ctx);
        drawDragLine(); drawFeedback(); drawStateOverlay(); drawRecreateMenu(); drawAchievementPopup();
    }

        ctx.fillText('?', hx+hs/2, hy+hs/2);

        const rx = W-60, ry = 15, rs = 42;
        ctx.fillStyle = COLORS.paper; ctx.beginPath(); ctx.arc(rx+rs/2,ry+rs/2,rs/2,0,Math.PI*2); ctx.fill();

        ctx.fillStyle = COLORS.ink; ctx.fillText('Cancelar', btn2X+btnW/2, btnY+btnH/2);

        game.buttons = [
            { x: btn1X, y: btnY, w: btnW, h: btnH, id: 'reset_yes' },
            { x: btn2X, y: btnY, w: btnW, h: btnH, id: 'reset_no' }
        ];
    }

    function getPos(e) { const t = e.touches ? (e.touches[0]||e.changedTouches[0]) : e; const r = canvas.getBoundingClientRect(); return { x: t.clientX-r.left, y: t.clientY-r.top }; }
    function pointInRect(px, py, r) { return px >= r.x && px <= r.x+r.w && py >= r.y && py <= r.y+r.h; }

    function handleClick(x, y) {
        initAudio();
        for (const b of game.buttons) { if (pointInRect(x, y, b)) { soundClick(); handleButton(b.id); return true; } }
        return false;
    }

    function handleButton(id) {
        if (id === 'play') { game.screen = 'levelSelect'; game.challengeMode = false; }
        else if (id === 'continue') { startLevel(saveData.maxLevel); game.screen = 'playing'; game.challengeMode = false; }
        else if (id === 'challenge') { game.screen = 'levelSelect'; game.challengeMode = true; }
        else if (id === 'album') { game.screen = 'album'; }
        else if (id === 'achievements') { game.screen = 'achievements'; }
        else if (id === 'stats') { game.screen = 'stats'; }
        else if (id === 'back') { game.screen = 'menu'; stopDragSound(); recreateMenuOpen = false; }
        else if (id.startsWith('level_')) { startLevel(parseInt(id.split('_')[1])); game.screen = 'playing'; recreateMenuOpen = false; }
        else if (id === 'recreate') toggleRecreateMenu();
        else if (id === 'hint') useHint();
        else if (id === 'closeRecreate') recreateMenuOpen = false;
        else if (id.startsWith('recreate_')) recreateElement(id.replace('recreate_',''));
        else if (id === 'reset') { game.screen = 'resetConfirm'; soundClick(); }
        else if (id === 'reset_yes') {
            localStorage.removeItem(SAVE_KEY);
            saveData = loadSave();
            game.screen = 'menu';
            showFeedback('🗑 Progresso zerado!');
            soundFail();
        }
        else if (id === 'reset_no') { game.screen = 'menu'; }
    }

    function onDown(e) {
        e.preventDefault(); initAudio();
        if (!musicPlaying && !muted) startMusic();
        const pos = getPos(e);
        if (game.screen !== 'playing') { handleClick(pos.x, pos.y); return; }
        if (recreateMenuOpen) { handleClick(pos.x, pos.y); return; }
        if (game.state !== 'playing') return;
        if (handleClick(pos.x, pos.y)) return;
        for (const el of game.levelManager.elements) {
            if (el.alive && el.contains(pos.x, pos.y)) {
                game.selectedElement = el; game.isDragging = true; game.dragPos = pos; startDragSound(); return;
            }
        }
    }
    function onMove(e) { e.preventDefault(); if (game.isDragging) { game.dragPos = getPos(e); if (game.screen === 'playing') addInkTrail(game.dragPos.x, game.dragPos.y); } }
    function onUp(e) {
        e.preventDefault();
        if (!game.isDragging || !game.selectedElement) { game.isDragging = false; stopDragSound(); return; }
        stopDragSound(); const pos = getPos(e); game.isDragging = false;
        for (const el of game.levelManager.elements) {
            if (el.alive && el !== game.selectedElement && el.contains(pos.x, pos.y)) { attemptCombination(game.selectedElement, el); break; }
        }
        game.selectedElement = null; game.dragPos = null;
    }

    canvas.addEventListener('touchstart', onDown, { passive: false });
    canvas.addEventListener('touchmove', onMove, { passive: false });
    canvas.addEventListener('touchend', onUp, { passive: false });
    canvas.addEventListener('mousedown', onDown);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseup', onUp);

    function startLevel(num) {
        game.levelManager.loadLevel(num); game.inkTimer.reset();
        game.state = 'playing'; game.stateTimer = 0; game.levelTime = 0; game.levelErrors = 0;
        particles.length = 0; inkTrail.length = 0; scratchMarks.length = 0;
        if (!saveData.attempts[num]) saveData.attempts[num] = 0;
        saveData.attempts[num]++;
        if (saveData.attempts[num] >= 10) unlockAchievement('persistent');
        saveSave(saveData);
    }

    function attemptCombination(a, b) {
        const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
        const result = game.levelManager.tryCombine(a.id, b.id, mx, my);
        if (result) {
            spawnParticles(mx, my, COLORS.ink, 25); soundCombine();
            const isNew = !saveData.discovered.includes(result.id);
            a.alive = false; b.alive = false;
            game.levelManager.addElement(result); game.inkTimer.add(10);
            saveData.stats.totalCombinations++;
            if (isNew) { saveData.discovered.push(result.id); result.isNew = true; soundDiscovery(); showFeedback(' NOVO: '+result.name+'!'); }
            else showFeedback('✦ '+result.name+' criado! +10 tinta');
            saveSave(saveData); checkAchievements();
            if (result.id === game.levelManager.targetId) {
                game.state = 'complete'; game.stateTimer = 0; soundLevelUp(); spawnConfetti(W/2, H/2, 80);
                const next = game.levelManager.currentLevel+1;
                if (next > saveData.maxLevel && next <= game.levelManager.totalLevels+1) saveData.maxLevel = next;
                saveData.stats.levelsCompleted++;
                const lvl = game.levelManager.currentLevel;
                if (!saveData.bestTimes[lvl] || game.levelTime < saveData.bestTimes[lvl]) saveData.bestTimes[lvl] = game.levelTime;
                if (game.levelErrors === 0) unlockAchievement('perfectionist');
                if (game.levelTime < 20) unlockAchievement('speedy');
                if (game.inkTimer.percent < 0.1) unlockAchievement('survivor');
                saveSave(saveData); checkAchievements();
            }
        } else {
            spawnParticles(mx, my, COLORS.inkRed, 10); addScratchMark(mx, my); soundFail();
            showFeedback('Esses traços não combinam...'); game.levelErrors++;
            saveData.stats.totalErrors++; saveSave(saveData);
        }
    }

    function showFeedback(msg) { game.feedback = msg; game.feedbackTimer = 2.2; }

    function gameLoop(timestamp) {
        if (!game.lastTime) game.lastTime = timestamp;
        const dt = Math.min((timestamp-game.lastTime)/1000, 0.1);
        game.lastTime = timestamp; game.menuAnim += dt;

        for (let i = particles.length-1; i >= 0; i--) { particles[i].update(dt); if (particles[i].life <= 0) particles.splice(i,1); }
        for (let i = inkTrail.length-1; i >= 0; i--) { inkTrail[i].life -= dt*2; if (inkTrail[i].life <= 0) inkTrail.splice(i,1); }
        for (let i = scratchMarks.length-1; i >= 0; i--) { scratchMarks[i].life -= dt*0.5; if (scratchMarks[i].life <= 0) scratchMarks.splice(i,1); }
        if (achievementPopup) { achievementPopup.timer -= dt; if (achievementPopup.timer <= 0) achievementPopup = null; }

        if (game.screen === 'playing') {
            for (const el of game.levelManager.elements) el.update(dt);
            if (game.state === 'playing') {
                game.inkTimer.update(dt); game.levelTime += dt; saveData.stats.totalTimePlayed += dt;
                if (game.inkTimer.isEmpty) { game.state = 'failed'; game.stateTimer = 0; soundFail(); saveSave(saveData); }
            }
            if (game.state === 'complete' || game.state === 'failed') {
                game.stateTimer += dt;
                if (game.stateTimer > 3.2) {
                    if (game.state === 'complete') {
                        const next = game.levelManager.currentLevel+1;
                        if (next <= game.levelManager.totalLevels) startLevel(next);
                        else { showFeedback('🎉 Parabéns! Você completou o jogo!'); game.screen = 'menu'; }
                    } else startLevel(game.levelManager.currentLevel);
                }
            }
            if (game.feedbackTimer > 0) game.feedbackTimer -= dt;
        }

        ctx.clearRect(0, 0, W, H);
        switch(game.screen) {
            case 'menu': drawMenu(); break;
            case 'levelSelect': drawLevelSelect(); break;
            case 'album': drawAlbum(); break;
            case 'achievements': drawAchievements(); break;
            case 'stats': drawStats(); break;
            case 'playing': drawGame(); break;
            case 'resetConfirm': drawResetConfirm(); break;
        }
        requestAnimationFrame(gameLoop);
    }

    resize(); initMenuElements(); requestAnimationFrame(gameLoop);
    </script>
</body>
